name: sns-trend-performance-analyzer

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend:
    build: ./backend
    volumes:
      - ./demo_data:/demo_data:ro
      - runtime_secrets:/var/lib/sns-analyzer/secrets
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      MAX_IMPORT_FILE_SIZE_BYTES: ${MAX_IMPORT_FILE_SIZE_BYTES:-20971520}
      MAX_IMPORT_REQUEST_SIZE_BYTES: ${MAX_IMPORT_REQUEST_SIZE_BYTES:-22020096}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      LIVE_MODE_ENABLED: ${LIVE_MODE_ENABLED:-false}
      JOB_REDISPATCH_SECONDS: ${JOB_REDISPATCH_SECONDS:-300}
      JOB_STALE_SECONDS: ${JOB_STALE_SECONDS:-900}
      RUNTIME_SECRET_STORE_DIR: /var/lib/sns-analyzer/secrets
      RUNTIME_SECRET_KEY: ${RUNTIME_SECRET_KEY:-}
      RUNTIME_SECRET_KEY_FILE: ${RUNTIME_SECRET_KEY_FILE:-}
      PROVIDER_CONNECT_TIMEOUT_SECONDS: ${PROVIDER_CONNECT_TIMEOUT_SECONDS:-5}
      PROVIDER_READ_TIMEOUT_SECONDS: ${PROVIDER_READ_TIMEOUT_SECONDS:-20}
      PROVIDER_MAX_RETRY_AFTER_SECONDS: ${PROVIDER_MAX_RETRY_AFTER_SECONDS:-60}
      X_OAUTH_BOOTSTRAP_ENABLED: ${X_OAUTH_BOOTSTRAP_ENABLED:-false}
      X_LIVE_SMOKE_ENABLED: ${X_LIVE_SMOKE_ENABLED:-false}
      X_LIVE_REFRESH_SMOKE_ENABLED: ${X_LIVE_REFRESH_SMOKE_ENABLED:-false}
      X_OAUTH_CLIENT_TYPE: ${X_OAUTH_CLIENT_TYPE:-}
      X_OAUTH_REDIRECT_URI: ${X_OAUTH_REDIRECT_URI:-}
      X_INITIAL_MAX_RESULTS: ${X_INITIAL_MAX_RESULTS:-5}
      X_INCREMENTAL_PAGE_SIZE: ${X_INCREMENTAL_PAGE_SIZE:-100}
      X_INCREMENTAL_MAX_PAGES: ${X_INCREMENTAL_MAX_PAGES:-5}
      X_TOKEN_REFRESH_SKEW_SECONDS: ${X_TOKEN_REFRESH_SKEW_SECONDS:-300}
      X_TOKEN_EXPIRES_AT: ${X_TOKEN_EXPIRES_AT:-}
      X_TOKEN_EXPIRES_AT_FILE: ${X_TOKEN_EXPIRES_AT_FILE:-}
      X_CLIENT_ID_FILE: ${X_CLIENT_ID_FILE:-}
      X_USER_ACCESS_TOKEN: ${X_USER_ACCESS_TOKEN:-}
      X_USER_ACCESS_TOKEN_FILE: ${X_USER_ACCESS_TOKEN_FILE:-}
      X_REFRESH_TOKEN: ${X_REFRESH_TOKEN:-}
      X_REFRESH_TOKEN_FILE: ${X_REFRESH_TOKEN_FILE:-}
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      X_CLIENT_SECRET_FILE: ${X_CLIENT_SECRET_FILE:-}
      INSTAGRAM_OAUTH_BOOTSTRAP_ENABLED: ${INSTAGRAM_OAUTH_BOOTSTRAP_ENABLED:-false}
      INSTAGRAM_LIVE_SMOKE_ENABLED: ${INSTAGRAM_LIVE_SMOKE_ENABLED:-false}
      INSTAGRAM_LIVE_REFRESH_SMOKE_ENABLED: ${INSTAGRAM_LIVE_REFRESH_SMOKE_ENABLED:-false}
      INSTAGRAM_GRAPH_API_VERSION: ${INSTAGRAM_GRAPH_API_VERSION:-v26.0}
      INSTAGRAM_OAUTH_REDIRECT_URI: ${INSTAGRAM_OAUTH_REDIRECT_URI:-}
      INSTAGRAM_TOKEN_REFRESH_SKEW_SECONDS: ${INSTAGRAM_TOKEN_REFRESH_SKEW_SECONDS:-604800}
      INSTAGRAM_TOKEN_EXPIRES_AT: ${INSTAGRAM_TOKEN_EXPIRES_AT:-}
      INSTAGRAM_TOKEN_EXPIRES_AT_FILE: ${INSTAGRAM_TOKEN_EXPIRES_AT_FILE:-}
      INSTAGRAM_TOKEN_ISSUED_AT: ${INSTAGRAM_TOKEN_ISSUED_AT:-}
      INSTAGRAM_TOKEN_ISSUED_AT_FILE: ${INSTAGRAM_TOKEN_ISSUED_AT_FILE:-}
      INSTAGRAM_CLIENT_ID_FILE: ${INSTAGRAM_CLIENT_ID_FILE:-}
      INSTAGRAM_USER_ACCESS_TOKEN: ${INSTAGRAM_USER_ACCESS_TOKEN:-}
      INSTAGRAM_USER_ACCESS_TOKEN_FILE: ${INSTAGRAM_USER_ACCESS_TOKEN_FILE:-}
      INSTAGRAM_REFRESH_TOKEN: ${INSTAGRAM_REFRESH_TOKEN:-}
      INSTAGRAM_REFRESH_TOKEN_FILE: ${INSTAGRAM_REFRESH_TOKEN_FILE:-}
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:-}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET:-}
      INSTAGRAM_CLIENT_SECRET_FILE: ${INSTAGRAM_CLIENT_SECRET_FILE:-}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build: ./backend
    volumes:
      - runtime_secrets:/var/lib/sns-analyzer/secrets
    command: ["celery", "-A", "app.jobs.celery_app:app", "worker", "--loglevel=WARNING", "--concurrency=2", "--hostname=sns-worker@%h"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      LIVE_MODE_ENABLED: ${LIVE_MODE_ENABLED:-false}
      JOB_REDISPATCH_SECONDS: ${JOB_REDISPATCH_SECONDS:-300}
      JOB_STALE_SECONDS: ${JOB_STALE_SECONDS:-900}
      RUNTIME_SECRET_STORE_DIR: /var/lib/sns-analyzer/secrets
      RUNTIME_SECRET_KEY: ${RUNTIME_SECRET_KEY:-}
      RUNTIME_SECRET_KEY_FILE: ${RUNTIME_SECRET_KEY_FILE:-}
      PROVIDER_CONNECT_TIMEOUT_SECONDS: ${PROVIDER_CONNECT_TIMEOUT_SECONDS:-5}
      PROVIDER_READ_TIMEOUT_SECONDS: ${PROVIDER_READ_TIMEOUT_SECONDS:-20}
      PROVIDER_MAX_RETRY_AFTER_SECONDS: ${PROVIDER_MAX_RETRY_AFTER_SECONDS:-60}
      X_OAUTH_BOOTSTRAP_ENABLED: ${X_OAUTH_BOOTSTRAP_ENABLED:-false}
      X_LIVE_SMOKE_ENABLED: ${X_LIVE_SMOKE_ENABLED:-false}
      X_LIVE_REFRESH_SMOKE_ENABLED: ${X_LIVE_REFRESH_SMOKE_ENABLED:-false}
      X_OAUTH_CLIENT_TYPE: ${X_OAUTH_CLIENT_TYPE:-}
      X_OAUTH_REDIRECT_URI: ${X_OAUTH_REDIRECT_URI:-}
      X_INITIAL_MAX_RESULTS: ${X_INITIAL_MAX_RESULTS:-5}
      X_INCREMENTAL_PAGE_SIZE: ${X_INCREMENTAL_PAGE_SIZE:-100}
      X_INCREMENTAL_MAX_PAGES: ${X_INCREMENTAL_MAX_PAGES:-5}
      X_TOKEN_REFRESH_SKEW_SECONDS: ${X_TOKEN_REFRESH_SKEW_SECONDS:-300}
      X_TOKEN_EXPIRES_AT: ${X_TOKEN_EXPIRES_AT:-}
      X_TOKEN_EXPIRES_AT_FILE: ${X_TOKEN_EXPIRES_AT_FILE:-}
      X_CLIENT_ID_FILE: ${X_CLIENT_ID_FILE:-}
      X_USER_ACCESS_TOKEN: ${X_USER_ACCESS_TOKEN:-}
      X_USER_ACCESS_TOKEN_FILE: ${X_USER_ACCESS_TOKEN_FILE:-}
      X_REFRESH_TOKEN: ${X_REFRESH_TOKEN:-}
      X_REFRESH_TOKEN_FILE: ${X_REFRESH_TOKEN_FILE:-}
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      X_CLIENT_SECRET_FILE: ${X_CLIENT_SECRET_FILE:-}
      INSTAGRAM_OAUTH_BOOTSTRAP_ENABLED: ${INSTAGRAM_OAUTH_BOOTSTRAP_ENABLED:-false}
      INSTAGRAM_LIVE_SMOKE_ENABLED: ${INSTAGRAM_LIVE_SMOKE_ENABLED:-false}
      INSTAGRAM_LIVE_REFRESH_SMOKE_ENABLED: ${INSTAGRAM_LIVE_REFRESH_SMOKE_ENABLED:-false}
      INSTAGRAM_GRAPH_API_VERSION: ${INSTAGRAM_GRAPH_API_VERSION:-v26.0}
      INSTAGRAM_OAUTH_REDIRECT_URI: ${INSTAGRAM_OAUTH_REDIRECT_URI:-}
      INSTAGRAM_TOKEN_REFRESH_SKEW_SECONDS: ${INSTAGRAM_TOKEN_REFRESH_SKEW_SECONDS:-604800}
      INSTAGRAM_TOKEN_EXPIRES_AT: ${INSTAGRAM_TOKEN_EXPIRES_AT:-}
      INSTAGRAM_TOKEN_EXPIRES_AT_FILE: ${INSTAGRAM_TOKEN_EXPIRES_AT_FILE:-}
      INSTAGRAM_TOKEN_ISSUED_AT: ${INSTAGRAM_TOKEN_ISSUED_AT:-}
      INSTAGRAM_TOKEN_ISSUED_AT_FILE: ${INSTAGRAM_TOKEN_ISSUED_AT_FILE:-}
      INSTAGRAM_CLIENT_ID_FILE: ${INSTAGRAM_CLIENT_ID_FILE:-}
      INSTAGRAM_USER_ACCESS_TOKEN: ${INSTAGRAM_USER_ACCESS_TOKEN:-}
      INSTAGRAM_USER_ACCESS_TOKEN_FILE: ${INSTAGRAM_USER_ACCESS_TOKEN_FILE:-}
      INSTAGRAM_REFRESH_TOKEN: ${INSTAGRAM_REFRESH_TOKEN:-}
      INSTAGRAM_REFRESH_TOKEN_FILE: ${INSTAGRAM_REFRESH_TOKEN_FILE:-}
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:-}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET:-}
      INSTAGRAM_CLIENT_SECRET_FILE: ${INSTAGRAM_CLIENT_SECRET_FILE:-}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s

  beat:
    build: ./backend
    command: ["celery", "-A", "app.jobs.celery_app:app", "beat", "--loglevel=WARNING", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      LIVE_MODE_ENABLED: ${LIVE_MODE_ENABLED:-false}
      SCHEDULER_TICK_SECONDS: ${SCHEDULER_TICK_SECONDS:-30}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  runtime_secrets:
